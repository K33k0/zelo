name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install dependencies
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Check formatting and unit tests
        shell: pwsh
        run: |
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-native.ps1
      - name: Browser regression tests
        run: npm run test:browser
      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android build, lint and test compilation
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./gradlew.bat --no-daemon --console=plain assembleDebugAndroidTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload preview APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zelo-preview-${{ github.sha }}
          path: dist/zelo-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            test-results/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
