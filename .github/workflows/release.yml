name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      ZELO_KEYSTORE_PATH: ${{ github.workspace }}/zelo-signing.keystore
      ZELO_KEYSTORE_PASSWORD: ${{ secrets.ZELO_KEYSTORE_PASSWORD }}
      ZELO_KEY_ALIAS: ${{ secrets.ZELO_KEY_ALIAS }}
      ZELO_KEY_PASSWORD: ${{ secrets.ZELO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Validate version and restore signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ZELO_KEYSTORE_BASE64 }}
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:EVENT_NAME -eq 'push' -and $env:RELEASE_TAG -cne "v$version") { throw 'Tag must match package.json version.' }
          if ((Get-Content app/build.gradle -Raw) -notmatch "versionName '$([regex]::Escape($version))'") { throw 'Android and package versions differ.' }
          if (!(Test-Path "RELEASE-$version.md")) { throw 'Versioned release notes are required.' }
          foreach ($value in @($env:KEYSTORE_BASE64, $env:ZELO_KEYSTORE_PASSWORD, $env:ZELO_KEY_ALIAS, $env:ZELO_KEY_PASSWORD)) {
            if ([string]::IsNullOrWhiteSpace($value)) { throw 'All four ZELO signing secrets must be configured.' }
          }
          [IO.File]::WriteAllBytes($env:ZELO_KEYSTORE_PATH, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "ZELO_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build signed APK
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gradlew.bat --no-daemon --console=plain assembleRelease lintRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          $apk = "zelo-$env:ZELO_VERSION.apk"
          Copy-Item app/build/outputs/apk/release/app-release.apk "dist/$apk"
          $certificate = & "$env:ANDROID_HOME/build-tools/35.0.0/apksigner.bat" verify --print-certs "dist/$apk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $certificate | Write-Output
          if (($certificate -join "`n") -notmatch 'SHA-256 digest: c0304fe6b9340cd75fc8c3d7e0f6ccfb401f496fa0cf73a04471f5d770d4952e') { throw 'APK does not match the original personal signing certificate.' }
          $hash = (Get-FileHash "dist/$apk" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), "$hash  $apk`n")
      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zelo-signed-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG "dist/zelo-$env:ZELO_VERSION.apk" dist/SHA256SUMS.txt --verify-tag --title "Zelo $env:ZELO_VERSION" --notes-file "RELEASE-$env:ZELO_VERSION.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove signing key
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:ZELO_KEYSTORE_PATH) { Remove-Item -LiteralPath $env:ZELO_KEYSTORE_PATH -Force }
