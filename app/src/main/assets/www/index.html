<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f1123" />
    <title>Zelo · by ecletra</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="#" aria-label="Zelo home"
          ><span class="product-mark" aria-hidden="true">Z</span
          ><span class="brand-text"><strong>zelo</strong><small>by ecletra</small></span></a
        >
        <div class="header-right">
          <span class="header-note">TURN EFFORT INTO PROGRESS</span
          ><button class="avatar" id="settings" aria-label="Settings and backup">⚙</button>
        </div>
      </header>
      <main id="main"></main>
      <nav aria-label="Main navigation">
        <button data-nav="today" class="active"><span aria-hidden="true">◎</span>Today</button
        ><button data-nav="challenges"><span aria-hidden="true">◫</span>Challenges</button
        ><button data-nav="activity"><span aria-hidden="true">↗</span>Activity</button
        ><button data-nav="insights"><span aria-hidden="true">▥</span>Insights</button>
      </nav>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status"></div>
    <input type="file" id="import-file" accept="application/json" hidden />
    <script type="module" src="app.js"></script>
  </body>
</html>
